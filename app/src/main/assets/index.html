<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07182e">
<title>Bander TV</title>
<style>
:root{color-scheme:dark;--bg:#08172d;--gold:#f0bf86;--text:#f8f7f3;--muted:#bbc7d8;--line:#ffffff26}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffe9c5;outline-offset:4px}
body{min-height:100vh;background:radial-gradient(ellipse 75% 60% at 88% 23%,#25446a55,transparent 85%),linear-gradient(180deg,#071a35 0%,#101e39 43%,#060f23 100%);}
#sky{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.70;pointer-events:none}
#sky::selection{background:transparent}
.page{position:relative;z-index:1;min-height:100vh;padding:3.6vh 5% 4vh;max-width:2000px;margin:auto}
.top{display:flex;align-items:start;justify-content:space-between;gap:30px}
.brand{font-size:clamp(30px,4vw,68px);font-family:Georgia,serif;color:var(--gold);font-weight:600;letter-spacing:.02em;direction:ltr}
.timebox{text-align:left;color:#f5f7fc}.clock{font-size:clamp(27px,3.2vw,50px);line-height:1.05}.date{color:#c7d3e4;font-size:clamp(13px,1.12vw,21px);margin-top:10px}
nav{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap;margin:5.5vh 0 3vh}
nav button{color:#e7effb;border:1px solid transparent;background:transparent;border-radius:50px;padding:12px 29px;font-size:clamp(15px,1.35vw,23px)}
nav button.active{color:#172741;background:#f3e6d3;box-shadow:0 3px 18px #edd4a333;font-weight:bold}
main{width:100%}.panels{display:grid;grid-template-columns:minmax(250px,1fr) minmax(330px,1.5fr);gap:20px;min-height:210px}
.panel{border:1px solid var(--line);border-radius:22px;padding:22px 26px;background:linear-gradient(145deg,#0e2e579a,#07182cbd);box-shadow:0 15px 45px #0003;backdrop-filter:blur(12px)}
.panel h2{font-size:clamp(17px,1.55vw,26px);margin:0 0 15px;font-weight:600}
.panel p{color:#e6edf9;margin:10px 0}
.team-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.team{font-size:clamp(23px,2vw,37px);color:#fff;font-weight:bold}.tiny{color:var(--muted);font-size:clamp(12px,.95vw,16px)}
.panel a,.link{background:#e9dcce;border:0;border-radius:12px;color:#152743;font-weight:bold;padding:12px 19px;text-decoration:none;display:inline-block;font-size:clamp(14px,1vw,18px)}
.info-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}
.weather-big{font-size:clamp(30px,3vw,54px);font-weight:600}.prayer-list{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.prayer{border:1px solid #ffffff22;background:#ffffff0c;border-radius:10px;padding:10px 4px;text-align:center}
.prayer strong{display:block;margin-top:9px;color:#f5dcc1;font-weight:500}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:5vh 0 15px}
.section-head h2{font-size:clamp(19px,1.5vw,27px);margin:0}
.ghost{color:#edf4ff;border:1px solid #ffffff58;background:#152d4b9c;padding:11px 18px;border-radius:12px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:17px}
.tile{border:1px solid #ffffff20;border-radius:19px;background:linear-gradient(145deg,#233a5cdd,#0c1d34ef);min-height:155px;padding:18px 10px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:.15s}
.tile:hover,.tile:focus-visible{background:#21456c;transform:translateY(-3px)}
.tile-icon{width:65px;height:65px;border-radius:15px;display:grid;place-items:center;background:#203e60;font-size:36px}
.tile-icon img{object-fit:contain;max-width:57px;max-height:57px}
.tile-label{font-size:clamp(13px,1.13vw,20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.empty{color:#b8c6d8;padding:20px 0}.wide{max-width:1040px;margin:auto}
.page-title{font-size:29px;margin:5vh 0 18px}
.search{border:1px solid #ffffff55;background:#071b33ed;color:#fff;border-radius:14px;padding:14px 18px;width:min(100%,550px);font-size:19px}
.muted{color:var(--muted)}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px;border-bottom:1px solid #ffffff20}
.settings-row:last-child{border:0}.settings-row strong{font-size:20px}
footer{margin-top:5vh;color:#b7c7dc;font-size:13px;display:flex;justify-content:space-between}
.cover{position:fixed;inset:0;z-index:10;background:#020a16df;display:grid;place-items:center;padding:15px}
.cover.hidden{display:none}.dialog{width:min(600px,96vw);border:1px solid #b1cad559;background:#101f36;border-radius:24px;padding:32px;box-shadow:0 25px 70px #0008}
.dialog h2{margin:0 0 12px;font-size:28px;color:var(--gold)}.dialog p{line-height:1.8;color:#d9e2ec}
.dialog label{display:block;margin:18px 0 8px;font-size:17px}
.dialog input{display:block;width:100%;border:1px solid #849bbd;background:#08192f;color:#fff;border-radius:12px;padding:13px 16px}
.dialog input::placeholder{color:#98a8bd}.btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.primary{background:#e8d4bc;color:#152338;border:0;padding:13px 22px;border-radius:12px;font-weight:bold}
.err{color:#ffd2ab;min-height:18px}
.location-options{display:flex;flex-wrap:wrap;gap:10px;margin-top:13px}
.location-options button{padding:10px 14px;border-radius:10px;border:1px solid #adc8e069;background:#233d5a;color:#fff;text-align:right}
@media(max-width:900px){.panels,.info-grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.prayer-list{grid-template-columns:repeat(5,1fr)}.page{padding:26px 4%}.brand{font-size:38px}}
@media(max-width:540px){nav{justify-content:start}nav button{padding:10px 15px}.tiles{grid-template-columns:repeat(2,1fr)}.prayer-list{grid-template-columns:repeat(3,1fr)}.panel{padding:18px}.tile{min-height:130px}}
</style>
</head>
<body>
<svg id="sky" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs><linearGradient id="skygrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#081c3d"/><stop offset=".67" stop-color="#17233e"/><stop offset="1" stop-color="#081023"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#skygrad)"/>
<path d="M0 460L160 420L300 455L410 423L530 467L650 424L800 457L950 440L1110 460L1320 420L1600 452V900H0Z" fill="#0c1c35" opacity=".75"/>
<path d="M0 555L180 531L380 560L540 535L735 552L900 510L1120 547L1320 520L1600 550V900H0Z" fill="#0a1930" opacity=".8"/>
<g opacity=".28" fill="#ecb77e"><circle cx="1152" cy="525" r="1.5"/><circle cx="1180" cy="526" r="2"/><circle cx="1231" cy="532" r="1.5"/><circle cx="1290" cy="528" r="2"/><circle cx="1340" cy="532" r="1.6"/><circle cx="1391" cy="530" r="1"/><circle cx="1050" cy="531" r="1"/></g>
<path d="M1200 250a25 25 0 1 0 23-43a29 29 0 1 1-23 43Z" fill="#f0c28e" opacity=".9"/>
</svg>
<div class="page">
<header class="top"><div class="brand">Bander TV</div><div class="timebox"><div id="clock" class="clock">--:--</div><div id="date" class="date">—</div></div></header>
<nav aria-label="التنقل"><button data-view="home" class="active">الرئيسية</button><button data-view="apps">التطبيقات</button><button data-view="settings">الإعدادات</button></nav>
<main id="content"></main>
<footer><span>واجهة عربية خاصة للتلفزيون</span><span>استخدم أسهم الريموت وزر موافق للتنقل</span></footer>
</div>
<div id="setup" class="cover hidden" role="dialog" aria-modal="true" aria-label="إعداد Bander TV">
<div class="dialog">
<h2>أهلًا بك في Bander TV</h2>
<p>خصص واجهتك مرة واحدة، ويمكنك تغيير اختيارك من الإعدادات لاحقًا.</p>
<label for="favTeam">وش النادي اللي تشجعه؟</label>
<input id="favTeam" autocomplete="off" placeholder="اكتب اسم ناديك المفضل" maxlength="75">
<label for="city">وش مدينتك أو منطقتك؟</label>
<input id="city" autocomplete="off" placeholder="مثال: جدة" maxlength="100">
<p class="tiny">نحتاج المدينة لعرض الطقس ومواقيت الصلاة. ما نحتاج موقعك الدقيق.</p>
<p id="setupError" class="err" role="status"></p>
<div id="locationOptions" class="location-options"></div>
<div class="btnrow"><button class="primary" data-action="save-setup">حفظ واختيار المدينة</button><button class="ghost" data-action="skip-city">الدخول بدون بيانات الطقس</button></div>
</div></div>
<script>
(function(){
'use strict';
var K='bander-tv-preferences-v2',prefs={team:'',city:'',place:null},view='home',apps=[],weather=null,prayers=null,searchText='',locationMatches=[];
try{var p=JSON.parse(localStorage.getItem(K)||'null');if(p&&typeof p==='object')prefs=Object.assign(prefs,p);}catch(e){}
function byId(id){return document.getElementById(id)}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]||'&#39;'})}
function save(){try{localStorage.setItem(K,JSON.stringify(prefs))}catch(e){}}
function tz(){return prefs.place&&prefs.place.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}
function clock(){try{return new Intl.DateTimeFormat('ar-SA-u-nu-latn',{timeZone:tz(),hour:'2-digit',minute:'2-digit'}).format(new Date())}catch(e){return '--:--'}}
function today(){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{timeZone:tz(),weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){return new Date().toLocaleDateString('ar-SA')}}
function dateApi(){var p=new Intl.DateTimeFormat('en-GB',{timeZone:tz(),day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date());var v={};p.forEach(function(i){v[i.type]=i.value});return v.day+'-'+v.month+'-'+v.year}
function updateClock(){byId('clock').textContent=clock();byId('date').textContent=today()}
function googleLink(){return 'https://www.google.com/search?q='+encodeURIComponent('نتائج '+prefs.team+' مباريات آخر مباراة')}
function openExternal(url){if(!/^https:\/\//.test(url))return;try{if(window.BandarAndroid&&window.BandarAndroid.openWebsite)window.BandarAndroid.openWebsite(url);else window.open(url,'_blank','noopener,noreferrer')}catch(e){notice('تعذّر فتح الرابط')}}
function notice(message){byId('notice').textContent=message;byId('notice').hidden=false}
function iconHtml(a){if(a.iconUrl&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(a.iconUrl))return '<img alt="" src="'+a.iconUrl+'">';return '<span>▣</span>'}
function appTile(a){return '<button class="tile" data-package="'+esc(a.pkg||'')+'" title="فتح '+esc(a.name)+'"><span class="tile-icon">'+iconHtml(a)+'</span><span class="tile-label">'+esc(a.name)+'</span></button>'}
function appsHtml(limit){var list=limit?apps.slice(0,limit):apps;return list.length?'<div class="tiles">'+list.map(appTile).join('')+'</div>':'<p class="empty">'+(window.BandarAndroid?'لم تظهر تطبيقات التلفزيون بعد. تأكد من تثبيت التطبيقات.':'تظهر تطبيقاتك المثبتة هنا عند فتح الواجهة على Android TV.')+'</p>'}
function prayerHtml(){var labels=[['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
return labels.map(function(pair){return '<div class="prayer"><span>'+pair[1]+'</span><strong>'+(prayers&&prayers[pair[0]]?esc(prayers[pair[0]].split(' ')[0]):'--:--')+'</strong></div>'}).join('')}
function homeHtml(){return '<div class="panels">'+
'<section class="panel"><div class="team-head"><h2>نتائج فريقي</h2><span class="tiny">⚽ النادي المفضل</span></div><div class="team">'+esc(prefs.team||'اختر فريقك')+'</div><p class="tiny">عرض النتائج والمباريات من بحث Google، بدون نتائج وهمية.</p><button class="link" data-action="results">عرض نتائج النادي ↗</button></section>'+
'<section class="panel"><div class="team-head"><h2>الطقس ومواقيت الصلاة</h2><span class="tiny">'+esc(prefs.place?prefs.place.label:(prefs.city||'حدد المدينة'))+'</span></div><div class="info-grid"><div><div class="weather-big">'+(weather?Math.round(weather.temperature_2m)+'°':'--°')+'</div><span class="tiny">'+(weather?'الطقس الآن':'درجة الحرارة غير متاحة')+'</span></div><div class="prayer-list">'+prayerHtml()+'</div></div><p class="tiny">قد تختلف المواقيت المحسوبة قليلًا عن تقويم مدينتك الرسمي.</p></section></div>'+
'<section><div class="section-head"><h2>التطبيقات</h2><button class="ghost" data-view="apps">كل التطبيقات ←</button></div>'+appsHtml(6)+'</section>'}
function appsPage(){return '<div class="wide"><h1 class="page-title">جميع التطبيقات</h1><input id="appSearch" class="search" placeholder="ابحث عن تطبيق" value="'+esc(searchText)+'" aria-label="بحث التطبيقات"><div class="section-head"><h2>تطبيقات التلفزيون</h2></div>'+appsHtml(0)+'</div>'}
function settingsPage(){return '<div class="wide"><h1 class="page-title">الإعدادات</h1><section class="panel">'+
'<div class="settings-row"><div><strong>النادي المفضل</strong><p class="muted">'+esc(prefs.team||'غير محدد')+'</p></div><button class="ghost" data-action="configure">تغيير</button></div>'+
'<div class="settings-row"><div><strong>المدينة أو المنطقة</strong><p class="muted">'+esc(prefs.place?prefs.place.label:(prefs.city||'غير محددة'))+'</p></div><button class="ghost" data-action="configure">تغيير</button></div>'+
'<div class="settings-row"><div><strong>الشبكة</strong><p class="muted">إعدادات اتصال التلفزيون</p></div><button class="ghost" data-action="wifi">فتح</button></div>'+
'<div class="settings-row"><div><strong>واجهة الشاشة الرئيسية</strong><p class="muted">اختيار Bander TV كواجهة Home إذا سمح النظام</p></div><button class="ghost" data-action="choose-home">اختيار</button></div>'+
'</section></div>'}
function render(){var active=document.activeElement;var focus=active&&active.dataset?(active.dataset.action||active.dataset.view||active.dataset.package):null;
document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});
byId('content').innerHTML=(view==='apps'?appsPage():view==='settings'?settingsPage():homeHtml())+'<p id="notice" class="tiny" hidden></p>';
if(focus){var targets=byId('content').querySelectorAll('button');for(var i=0;i<targets.length;i++){if(targets[i].dataset.action===focus||targets[i].dataset.view===focus||targets[i].dataset.package===focus){targets[i].focus();break}}}}
function showSetup(){byId('setup').classList.remove('hidden');byId('favTeam').value=prefs.team||'';byId('city').value=prefs.city||'';byId('setupError').textContent='';byId('locationOptions').innerHTML='';byId('favTeam').focus()}
function closeSetup(){byId('setup').classList.add('hidden');byId('locationOptions').innerHTML='';view='home';render()}
function setError(s){byId('setupError').textContent=s}
async function resolveCity(q){setError('جارٍ البحث عن مدينتك…');byId('locationOptions').innerHTML='';
try{var response=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q.split(/[،,]/)[0].trim())+'&count=5&language=ar&format=json');if(!response.ok)throw Error('network');
var data=await response.json();locationMatches=(data.results||[]).filter(function(p){return Number.isFinite(p.latitude)&&Number.isFinite(p.longitude)});
if(!locationMatches.length){setError('ما لقينا المدينة. جرّب اسم المدينة مع الدولة.');return}
setError('اختر مدينتك من النتائج:');
byId('locationOptions').innerHTML=locationMatches.map(function(loc,i){return '<button data-place="'+i+'">'+esc([loc.name,loc.admin1,loc.country].filter(Boolean).join('، '))+'</button>'}).join('');
}catch(e){setError('تعذر تحديد المدينة عبر الإنترنت. تقدر تدخل الواجهة بدون بيانات مؤقتًا.')}}
async function storeSetup(){var team=byId('favTeam').value.trim(),city=byId('city').value.trim();if(!team||!city){setError('اكتب النادي والمدينة أولًا.');return}var changed=city!==prefs.city;
prefs.team=team;prefs.city=city;if(changed){prefs.place=null;weather=null;prayers=null}save();render();if(!changed&&prefs.place){closeSetup();fetchLive();return}await resolveCity(city)}
function choosePlace(i){var loc=locationMatches[i];if(!loc)return;prefs.place={latitude:loc.latitude,longitude:loc.longitude,timezone:loc.timezone||'UTC',country_code:loc.country_code||'',label:[loc.name,loc.admin1,loc.country].filter(Boolean).join('، ')};save();weather=null;prayers=null;closeSetup();fetchLive()}
function navigate(next){view=next;render();var b=document.querySelector('nav button[data-view="'+next+'"]');if(b)b.focus()}
window.refreshInstalledApps=function(){if(!window.BandarAndroid||!window.BandarAndroid.getInstalledApps)return;try{var a=JSON.parse(window.BandarAndroid.getInstalledApps());if(Array.isArray(a)){apps=a.filter(function(x){return x&&x.pkg&&x.name}).sort(function(a,b){return a.name.localeCompare(b.name,'ar')});render()}}catch(e){console.warn('Cannot enumerate apps',e)}};
async function fetchLive(){if(!prefs.place)return;var loc=prefs.place,lat=loc.latitude,lon=loc.longitude;
try{var w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+'&current=temperature_2m,weather_code&timezone=auto');if(w.ok){var json=await w.json();weather=json.current||null;render()}}catch(e){weather=null;render()}
try{var query='https://api.aladhan.com/v1/timings/'+dateApi()+'?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+(loc.country_code==='SA'?'&method=4':'');
var p=await fetch(query);if(p.ok){var obj=await p.json();prayers=obj.data&&obj.data.timings||null;render()}}catch(e){prayers=null;render()}}
document.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
if(b.dataset.view)return navigate(b.dataset.view);
if(b.dataset.place!==undefined)return choosePlace(Number(b.dataset.place));
if(b.dataset.package){var pkg=b.dataset.package;if(window.BandarAndroid&&window.BandarAndroid.launchPackage){if(!window.BandarAndroid.launchPackage(pkg))notice('تعذر فتح التطبيق على هذا التلفزيون')}return}
var action=b.dataset.action;if(!action)return;
if(action==='configure')return showSetup();
if(action==='save-setup')return storeSetup();
if(action==='skip-city'){prefs.team=byId('favTeam').value.trim();prefs.city=byId('city').value.trim();prefs.place=null;weather=null;prayers=null;save();closeSetup();return}
if(action==='results'){if(!prefs.team)return showSetup();return openExternal(googleLink())}
if(action==='wifi'){if(window.BandarAndroid&&window.BandarAndroid.openWifiSettings)window.BandarAndroid.openWifiSettings();else notice('هذه الخاصية تتطلب جهاز Android TV');return}
if(action==='choose-home'){if(window.BandarAndroid&&window.BandarAndroid.chooseAsHome)window.BandarAndroid.chooseAsHome();else notice('التغيير متاح فقط على تلفزيون يدعم واجهة Home بديلة')}}
);
document.addEventListener('input',function(e){if(e.target.id==='appSearch'){searchText=e.target.value;var filtered=apps.filter(function(a){return a.name.toLowerCase().includes(searchText.toLowerCase())});var t=byId('content').querySelector('.tiles');if(t)t.innerHTML=filtered.map(appTile).join('')}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){if(!byId('setup').classList.contains('hidden'))return;if(view!=='home'){e.preventDefault();navigate('home')}return}
if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)||e.target.tagName==='INPUT')return;
var root=byId('setup').classList.contains('hidden')?document:byId('setup');
var all=Array.from(root.querySelectorAll('button:not(:disabled),input')).filter(function(x){return x.offsetWidth>0&&x.offsetHeight>0}),cur=document.activeElement;if(!all.includes(cur)){if(all[0])all[0].focus();e.preventDefault();return}
var r=cur.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,best=null,score=Infinity;
all.forEach(function(n){if(n===cur)return;var z=n.getBoundingClientRect(),dx=z.left+z.width/2-x,dy=z.top+z.height/2-y;
if(e.key==='ArrowRight'&&dx<=8||e.key==='ArrowLeft'&&dx>=-8||e.key==='ArrowDown'&&dy<=8||e.key==='ArrowUp'&&dy>=-8)return;
var horiz=e.key==='ArrowRight'||e.key==='ArrowLeft';var dist=(horiz?Math.abs(dx):Math.abs(dy))+(horiz?Math.abs(dy):Math.abs(dx))*2.2;if(dist<score){score=dist;best=n}});
if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest'})}});
updateClock();setInterval(updateClock,15000);render();window.refreshInstalledApps();if(!prefs.team||!prefs.place){showSetup()}else{fetchLive()}setInterval(function(){if(prefs.place)fetchLive()},30*60*1000);
})();
</script>
</body>
</html>
