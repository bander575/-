.topbar{display:flex;align-items:center;gap:25px;min-height:72px}.brand{font-size:26px;letter-spacing:-1px;font-weight:800;white-space:nowrap}.brand b{color:var(--accent)}.brand small{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:0;margin-right:8px}.navbar{display:flex;flex:1;justify-content:center;gap:6px;align-items:center}.nav-btn{position:relative;background:none;border:1px solid transparent;border-radius:14px;padding:13px clamp(8px,1vw,18px);white-space:nowrap;font-weight:700;color:#c2d1de;transition:background var(--ease),color var(--ease)}.nav-btn:hover,.nav-btn.active{color:#f8ffff;background:rgba(22,63,81,.4)}.nav-btn.active::after{content:'';position:absolute;right:22%;left:22%;height:3px;background:var(--accent);border-radius:8px;bottom:2px;box-shadow:0 0 12px var(--accent)}.top-actions{display:flex;gap:10px}.iconbtn{width:44px;height:44px;border:1px solid var(--border);border-radius:14px;background:rgba(10,30,49,.6);font-size:23px}.iconbtn:hover{background:rgba(50,97,123,.6)}.overline{font-size:13px;letter-spacing:2px;color:var(--accent);font-weight:800}.section-title{font-size:23px;font-weight:800;margin:0}.section-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 17px;gap:12px}.muted{color:var(--muted)}.outline{background:rgba(4,17,32,.5);border:1px solid var(--border);border-radius:11px;padding:9px 15px}.outline:hover{border-color:var(--accent)}
.hero{min-height:calc(100vh - 365px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:38px;padding-top:15px}.intro{justify-self:end;text-align:right;align-self:center}.welcome{font-size:clamp(16px,1.4vw,23px);font-weight:600;color:#d2e3ee;margin-bottom:10px}.clock{font-size:clamp(76px,9vw,170px);font-weight:300;letter-spacing:-6px;line-height:1.05;direction:ltr;text-align:right;text-shadow:0 3px 22px rgba(0,0,0,.2)}.dayline{font-size:clamp(15px,1.45vw,25px);font-weight:500;margin-top:3px}.dayline span{color:var(--muted)}.context{display:flex;gap:16px;justify-content:flex-start;align-items:center;margin-top:23px;color:#dbebf5}.context span{display:flex;align-items:center;gap:7px}.context strong{color:var(--accent)}.live-panels{align-self:center;justify-self:start;width:min(490px,100%);display:grid;gap:14px}.glass{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(0,0,0,.16)}.weather-panel{display:flex;justify-content:space-between;align-items:center;padding:25px 30px;min-height:130px}.weather-icon{font-size:58px;line-height:1}.temp{font-size:37px;font-weight:700;direction:ltr;text-align:right}.prayer-panel{padding:21px 24px}.prayer-head{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700;margin-bottom:17px}.prayer-items{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.prayer{padding:12px 4px;border-radius:11px;text-align:center}.prayer strong{display:block;font-size:15px}.prayer span{display:block;font-size:15px;color:#b7c9d7;margin-top:8px;direction:ltr}.prayer.highlight{background:rgba(var(--a-rgb),.13);border:1px solid rgba(var(--a-rgb),.48);box-shadow:0 0 17px rgba(var(--a-rgb),.15)}.prayer.highlight strong{color:var(--accent)}
.favorites{margin-top:4px}.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:14px}.app-tile{min-width:0;height:clamp(96px,10.8vw,168px);border-radius:20px;background:linear-gradient(165deg,rgba(39,58,82,.8),rgba(4,13,26,.94));border:1px solid rgba(189,224,239,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:transform var(--ease),border-color var(--ease),box-shadow var(--ease);text-decoration:none}.app-tile:hover,.app-tile:focus-visible{transform:translateY(-8px) scale(1.025);border-color:var(--accent);box-shadow:0 10px 36px rgba(0,0,0,.32),0 0 22px rgba(var(--a-rgb),.18)}.logo{display:flex;align-items:center;justify-content:center;width:68%;height:56px;font-size:clamp(15px,1.8vw,31px);font-weight:900;letter-spacing:-1.3px;border-radius:14px;text-align:center;direction:ltr}.app-tile span{font-size:15px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95%}.app-tile.white .logo{background:#fff;color:#ff0033;font-size:28px}.app-tile.netflix .logo{color:#ed2234;font-size:43px}.app-tile.shahid .logo{color:#fff}.app-tile.shahid .logo b{color:#58dc87}.app-tile.prime .logo{color:#8bd8ff}.app-tile.stc .logo{color:#faf7ff}.app-tile.stc{background:linear-gradient(155deg,#7131b6,#210b48)}.app-tile.spotify .logo{color:#1ed760}.app-tile.osn .logo{color:#f953cf}.app-tile.disney .logo{color:#eef8ff}.app-tile.more .logo{font-size:48px;font-weight:300;color:#a5eefa}
.content{padding-top:30px;min-height:calc(100vh - 180px)}.content-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.content-head h1{font-size:clamp(29px,3vw,48px);margin:8px 0}.desc{color:#b6c6d3;margin:0;max-width:690px;font-size:16px;line-height:1.8}.chips{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0 26px}.chip{border:1px solid var(--border);background:rgba(9,23,40,.65);border-radius:999px;padding:9px 20px;font-size:14px}.chip.active,.chip:hover{background:var(--accent);color:#071522;font-weight:800}.grid-apps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.grid-apps .app-tile{height:145px}.media-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}.poster{min-height:220px;border:1px solid var(--border);border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--p1),var(--p2));text-align:right;padding:17px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform var(--ease);box-shadow:0 13px 32px rgba(0,0,0,.23)}.poster:hover,.poster:focus-visible{transform:translateY(-7px);border-color:var(--accent)}.poster::before{content:'';position:absolute;inset:-30px;background:radial-gradient(circle at 15% 15%,var(--p3),transparent 40%),repeating-linear-gradient(135deg,transparent 0 30px,rgba(255,255,255,.025) 31px 32px);transform:rotate(-5deg)}.poster::after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,rgba(2,8,16,.95))}.poster .emoji{position:absolute;top:21%;left:50%;transform:translateX(-50%);font-size:62px;filter:drop-shadow(0 4px 15px rgba(0,0,0,.22))}.poster strong,.poster small{z-index:1}.poster strong{font-size:20px}.poster small{color:#d5e2ed;margin-top:7px}.streams{display:grid;grid-template-columns:1fr 1fr;gap:20px}.stream-card{display:flex;align-items:center;gap:18px;min-height:140px;border:1px solid var(--border);border-radius:21px;padding:20px;text-align:right;background:rgba(7,23,39,.7)}.stream-logo{width:110px;height:80px;flex-shrink:0;background:linear-gradient(130deg,#3d2a9b,#101c3b);border-radius:17px;display:grid;place-items:center;font-size:25px;font-weight:900;direction:ltr}.stream-card p{color:#bcd0e2;margin:5px 0}.stream-card:hover{border-color:var(--accent)}.tag{color:#75e6ee;font-size:12px}.small-note{background:rgba(13,42,58,.74);border:1px solid var(--border);border-radius:12px;padding:13px 17px;line-height:1.6;display:inline-block;margin:0 0 22px;color:#d4e3eb}.settings-layout{display:grid;grid-template-columns:250px 1fr;gap:20px}.settings-side{padding:15px}.settings-side button{display:block;padding:14px 17px;width:100%;text-align:right;border:0;background:none;border-radius:13px}.settings-side button.selected,.settings-side button:hover{background:rgba(var(--a-rgb),.15);color:var(--accent)}.settings-main{padding:28px}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--border)}.settings-row:last-child{border:0}.settings-row small{color:var(--muted);display:block;margin-top:8px}.switch{width:60px;height:32px;border:0;border-radius:40px;background:#40546b;position:relative}.switch:after{content:'';position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:white;transition:transform .2s}.switch.on{background:#18b9c7}.switch.on:after{transform:translateX(-28px)}.color-options{display:flex;gap:12px}.color-dot{width:37px;height:37px;border:3px solid transparent;border-radius:50%;background:var(--swatch)}.color-dot.picked{outline:2px solid white;outline-offset:2px}.search-box{background:rgba(10,29,47,.85);border:1px solid var(--border);border-radius:15px;color:white;padding:16px 20px;min-width:min(400px,80vw)}.bottom-tip{margin-top:25px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#8da5b6}.modal-shade{position:fixed;inset:0;background:rgba(0,5,14,.72);display:grid;place-items:center;z-index:40;padding:22px;backdrop-filter:blur(13px)}.modal{max-width:490px;width:100%;padding:29px;box-shadow:0 40px 100px rgba(0,0,0,.5)}.modal h2{margin:0 0 15px;font-size:25px}.modal p{line-height:1.9;color:#c4d5e1}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.primary{background:var(--accent);border:0;border-radius:12px;color:#06222a;font-weight:800;padding:12px 22px}.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-25px);top:15px;background:#0c2939;padding:14px 23px;border-radius:13px;border:1px solid var(--accent);color:white;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.quiz{padding:30px;max-width:720px;margin:auto;text-align:center}.quiz-letter{font-size:90px;margin:12px}.quiz-options{display:flex;gap:16px;justify-content:center;margin:20px 0}.quiz-options button{font-size:38px;border:1px solid var(--border);background:rgba(13,47,66,.88);padding:18px 30px;border-radius:20px}.quiz-score{font-weight:700;color:#96eaf3}.hidden{display:none!important}
@media(max-width:1100px){#app{padding:15px 25px 25px}.topbar{flex-wrap:wrap}.navbar{order:3;width:100%;overflow:auto;justify-content:flex-start}.nav-btn{padding:10px 13px}.hero{min-height:480px;gap:20px}.clock{font-size:92px}.tiles{gap:9px}.app-tile{height:116px}.media-grid{grid-template-columns:repeat(4,1fr)}.grid-apps{grid-template-columns:repeat(4,1fr)}}
@media(max-width:690px){#app{padding:10px 14px 23px}.brand{font-size:20px}.topbar{gap:10px}.top-actions{margin-right:auto}.navbar{gap:2px}.nav-btn{font-size:13px}.hero{display:flex;flex-direction:column;align-items:stretch;gap:25px;padding:65px 0 25px;min-height:unset}.intro{align-self:flex-start;justify-self:auto}.clock{font-size:83px}.live-panels{width:100%}.weather-panel{padding:17px 20px;min-height:110px}.prayer-panel{padding:16px}.prayer span{font-size:12px}.prayer strong{font-size:12px}.tiles{grid-template-columns:repeat(3,1fr)}.app-tile{height:113px}.app-tile span{font-size:12px}.content{padding-top:15px}.content-head{display:block}.grid-apps{grid-template-columns:repeat(3,1fr)}.grid-apps .app-tile{height:114px}.media-grid{grid-template-columns:repeat(2,1fr)}.poster{min-height:220px}.streams{grid-template-columns:1fr}.settings-layout{grid-template-columns:1fr}.settings-side{display:flex;flex-wrap:wrap}.settings-side button{width:auto}.settings-main{padding:15px}.bottom-tip{flex-direction:column}.search-box{min-width:100%;margin-top:15px}}

</style></head><body><div class="wallpaper" aria-hidden="true"></div><div class="scrim" aria-hidden="true"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="app"></div><script>/* Bandar TV — functioning prototype, 2026. All live data is retrieved only when online. */
(() => {
  'use strict';
  const APPS = [
    {id:'youtube',name:'YouTube',logo:'▶',css:'white',cat:'video',url:'https://www.youtube.com/tv',pkg:'com.google.android.youtube.tv'},
    {id:'netflix',name:'Netflix',logo:'N',css:'netflix',cat:'video',url:'https://www.netflix.com',pkg:'com.netflix.ninja'},
    {id:'shahid',name:'شاهد',logo:'شاهد',css:'shahid',cat:'video',url:'https://shahid.mbc.net',pkg:'net.mbc.shahidTV'},
    {id:'prime',name:'Prime Video',logo:'prime video',css:'prime',cat:'video',url:'https://www.primevideo.com',pkg:'com.amazon.amazonvideo.livingroom'},
    {id:'stc',name:'stc tv',logo:'stc tv',css:'stc',cat:'video',url:'https://stctv.com',pkg:'com.intigral.stctv'},
    {id:'spotify',name:'Spotify',logo:'◉',css:'spotify',cat:'music',url:'https://open.spotify.com',pkg:'com.spotify.tv.android'},
    {id:'disney',name:'Disney+',logo:'Disney+',css:'disney',cat:'video',url:'https://www.disneyplus.com',pkg:'com.disney.disneyplus'},
    {id:'osn',name:'OSN+',logo:'OSN+',css:'osn',cat:'video',url:'https://osnplus.com',pkg:'com.osn.go'},
    {id:'kids',name:'YouTube Kids',logo:'Kids ▶',css:'white',cat:'kids',url:'https://www.youtubekids.com',pkg:'com.google.android.apps.youtube.kids'},
    {id:'play',name:'Google Play',logo:'▷',css:'prime',cat:'tools',url:'https://play.google.com',pkg:'com.android.vending'},
    {id:'browser',name:'متصفح الويب',logo:'◎',css:'disney',cat:'tools',url:'https://www.google.com',pkg:'com.android.chrome'},
    {id:'music',name:'موسيقى',logo:'♫',css:'spotify',cat:'music',url:'https://music.youtube.com',pkg:'com.google.android.apps.youtube.music'}
  ];
  const NAV = [ ['home','الرئيسية'],['apps','التطبيقات'],['movies','الأفلام والمسلسلات'],['live','البث المباشر'],['kids','الأطفال'],['games','الألعاب'],['settings','الإعدادات'] ];
  const MEDIA = [
    {title:'أسرار المدينة',type:'مسلسل تشويقي',emo:'🌃',p1:'#19335a',p2:'#080e1e',p3:'#0ab7c0'},
    {title:'رحلة الصحراء',type:'فيلم مغامرات',emo:'🏜️',p1:'#a0612c',p2:'#251b1b',p3:'#ffce6a'},
    {title:'عالم الأعماق',type:'وثائقي',emo:'🐋',p1:'#125e7a',p2:'#0a152e',p3:'#20d6f3'},
    {title:'حكاية نجمة',type:'دراما',emo:'✨',p1:'#643c7e',p2:'#1a1635',p3:'#df83e9'},
    {title:'سباق الزمن',type:'أكشن',emo:'🏎️',p1:'#852f34',p2:'#100d22',p3:'#fd9255'},
    {title:'أبطال الغد',type:'محتوى عائلي',emo:'🚀',p1:'#23637a',p2:'#0e2238',p3:'#74e8e5'},
    {title:'حياة البراري',type:'وثائقي',emo:'🦁',p1:'#7b6433',p2:'#111f15',p3:'#d2ca55'},
    {title:'لغز القصر',type:'غموض',emo:'🏰',p1:'#47556c',p2:'#111725',p3:'#a8c8e6'},
    {title:'ضحكة عائلية',type:'كوميديا',emo:'😄',p1:'#c87a41',p2:'#553a43',p3:'#f5c68e'},
    {title:'مغامرة في الفضاء',type:'خيال علمي',emo:'🪐',p1:'#463a83',p2:'#090b20',p3:'#b2a3ff'}
  ];
  const STREAMS = [
    {name:'القنوات الرياضية',logo:'⚽',detail:'استعراض القنوات الرياضية'},
    {name:'القنوات الإخبارية',logo:'🌍',detail:'استعراض القنوات الإخبارية'},
    {name:'القنوات السعودية',logo:'🇸🇦',detail:'القنوات الوطنية'},
    {name:'القنوات العائلية',logo:'🏠',detail:'محتوى للعائلة'},
  ];
  const PRAYER_NAMES=[['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
  const COLORS={'cyan':['#40e0eb','64,224,235'],'purple':['#c89cff','200,156,255'],'gold':['#f4c071','244,192,113']};
  let view='home', category='all', modal='', settingsTab='appearance', query='', kidScore=0, quizIndex=0;
  const local = (k,def) => {try {return JSON.parse(localStorage.getItem('bandartv-'+k)) ?? def;} catch{return def}};
  const save = (k,v) => {try {localStorage.setItem('bandartv-'+k,JSON.stringify(v))}catch{}};
  let favorites=local('favorites',['youtube','netflix','shahid','prime','stc','disney']);
  let accent=local('accent','cyan');
  let compact=local('compact',false);
  let weather=null, prayers=null;
  let toastTimeout;
  const appElement = document.getElementById('app');
  const t=(str)=>String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  const nowRiyadh=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Riyadh'}));
  function dateLabel(){return new Intl.DateTimeFormat('ar-SA-u-nu-latn',{timeZone:'Asia/Riyadh',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());}
  function clockLabel(){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Riyadh',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}
  function applyAccent(){ const a=COLORS[accent]||COLORS.cyan;document.documentElement.style.setProperty('--accent',a[0]);document.documentElement.style.setProperty('--a-rgb',a[1]); }
  function showToast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),2800)}
  function navHTML(){return `<header class="topbar"><div class="brand">BANDAR <b>TV</b> <small>تلفزيون بندر</small></div><nav class="navbar" aria-label="الأقسام">${NAV.map(([id,name])=>`<button class="nav-btn ${view===id?'active':''}" data-view="${id}">${name}</button>`).join('')}</nav><div class="top-actions"><button class="iconbtn" data-action="search" aria-label="بحث">⌕</button><button class="iconbtn" data-view="settings" aria-label="الإعدادات">⚙</button></div></header>`}
  function appTile(app) { return `<button class="app-tile ${t(app.css)}" data-launch="${t(app.id)}" title="فتح ${t(app.name)}"><div class="logo">${t(app.logo)}</div><span>${t(app.name)}</span></button>`; }
  function favoriteTiles(){const list=favorites.map(id=>APPS.find(a=>a.id===id)).filter(Boolean).slice(0,6);return list.map(appTile).join('')+`<button class="app-tile more" data-view="apps"><div class="logo">＋</div><span>كل التطبيقات</span></button>`}
  function renderPrayers(){const valid=prayers?.timings;const pList=PRAYER_NAMES.map(([id,name])=>({name,time:valid?String(valid[id]).split(' ')[0]:'--:--'}));const c=clockLabel();let hi=-1;for(let i=0;i<pList.length;i++) if(pList[i].time!=='--:--'&&pList[i].time<=c)hi=i; if(hi===-1)hi=0;return pList.map((p,i)=>`<div class="prayer ${i===hi?'highlight':''}"><strong>${p.name}</strong><span>${p.time}</span></div>`).join('')}
  function renderHome(){return `<main><section class="hero"><div class="live-panels"><div class="glass weather-panel"><div><div class="muted" style="font-weight:700;margin-bottom:7px">الرياض، السعودية</div><div class="temp" id="temp">${weather?Math.round(weather.temperature_2m)+'°':'--°'}</div><div class="muted">${weather?'الطقس الآن':'جارٍ جلب حالة الطقس'}</div></div><div class="weather-icon" id="weather-icon">${weatherIcon()}</div></div><div class="glass prayer-panel"><div class="prayer-head"><span>☪ &nbsp;مواقيت الصلاة</span><small class="muted">الرياض</small></div><div class="prayer-items" id="prayers">${renderPrayers()}</div></div></div><div class="intro"><div class="welcome">✦ &nbsp; أهلاً بك في عالمك</div><div class="clock" id="clock">${clockLabel()}</div><div class="dayline" id="dayline">${dateLabel()}</div><div class="context"><span>📍 <strong>الرياض</strong></span><span>☀ تجربة تلفزيون بتصميمك</span></div></div></section><section class="favorites"><div class="section-top"><h2 class="section-title">تطبيقاتك المفضلة</h2><button class="outline" data-view="apps">عرض الكل ←</button></div><div class="tiles">${favoriteTiles()}</div></section></main>`}
  function weatherIcon(){const n=weather?.weather_code;if(n==null)return '☾';if(n<=1)return '☀';if(n<=3)return '⛅';if(n<=48)return '☁';if(n<=67)return '🌧';return '⛈'}
  function head(label,title,desc){return `<div class="content-head"><div><div class="overline">BANDAR TV / ${t(label)}</div><h1>${t(title)}</h1><p class="desc">${t(desc)}</p></div><div class="muted" style="white-space:nowrap">نسخة أولية قابلة للتجربة</div></div>`}
  function renderApps(){let filtered=APPS.filter(a=>(category==='all'||a.cat===category)&&(a.name.toLowerCase().includes(query.toLowerCase())));const chips=[['all','الكل'],['video','الفيديو'],['kids','الأطفال'],['music','الموسيقى'],['tools','أدوات']];return `<main class="content">${head('APPS','جميع التطبيقات','اختر تطبيقًا لفتحه. يمكنك إضافته إلى المفضلة من زر النجمة في بطاقة التفاصيل.')}<div class="chips">${chips.map(([id,name])=>`<button class="chip ${category===id?'active':''}" data-category="${id}">${name}</button>`).join('')}</div><div class="grid-apps">${filtered.map(appTile).join('')}</div>${filtered.length?'':'<p>لا توجد نتائج مطابقة.</p>'}</main>`}
  function renderMovies(){return `<main class="content">${head('CINEMA','الأفلام والمسلسلات','تصميم لقسم مكتبتك المستقبلية. عناوين هذه البطاقات أمثلة خيالية، ولا تحتوي على فيديوهات أو اشتراكات.')}<div class="small-note">🎬 هذا قسم تجريبي للعرض فقط — تشغيل الأفلام يتطلب خدمة محتوى مرخّصة وربطًا فعليًا.</div><div class="media-grid">${MEDIA.map((m,i)=>`<button class="poster" style="--p1:${m.p1};--p2:${m.p2};--p3:${m.p3}" data-media="${i}"><div class="emoji">${m.emo}</div><strong>${m.title}</strong><small>${m.type}</small></button>`).join('')}</div></main>`}
  function renderLive(){return `<main class="content">${head('LIVE TV','البث المباشر','واجهة جاهزة للتطوير، مع تقسيم القنوات السعودية والرياضية والإخبارية والعائلية.')}<div class="small-note">📡 القنوات المعروضة هنا قوائم تصميمية فقط وليست بثًا مباشرًا. إضافة البث تتطلب روابط قانونية ومصدرًا مرخّصًا.</div><div class="streams">${STREAMS.map((s,i)=>`<button class="stream-card" data-stream="${i}"><div class="stream-logo">${s.logo}</div><div><h2 style="margin:0">${s.name}</h2><p>${s.detail}</p><span class="tag">اضغط لعرض المعلومات ←</span></div></button>`).join('')}</div></main>`}
  function renderKids(){const quiz=[{q:'أي حرف تبدأ به كلمة أسد؟',a:['أ','ب','ت'],correct:'أ'},{q:'أي حرف تبدأ به كلمة بيت؟',a:['ج','ب','س'],correct:'ب'},{q:'أي حرف تبدأ به كلمة قمر؟',a:['م','س','ق'],correct:'ق'},{q:'أي حرف تبدأ به كلمة تفاح؟',a:['ت','ل','د'],correct:'ت'}][quizIndex%4];return `<main class="content">${head('KIDS','عالم الأطفال','تجربة ألعاب تعليمية بسيطة، بأزرار كبيرة مناسبة للريموت.')}<div class="glass quiz"><div style="font-size:40px">🦁 ⭐ 🎈</div><h2>${quiz.q}</h2><div class="quiz-letter">؟</div><div class="quiz-options">${quiz.a.map(a=>`<button data-quiz="${a}">${a}</button>`).join('')}</div><div class="quiz-score">إجابات صحيحة: ${kidScore}</div></div></main>`}
  function renderGames(){return `<main class="content">${head('GAMES','الألعاب','اختر إحدى التجارب المصغرة أو افتح قسم الأطفال للعبة الحروف التفاعلية.')}<div class="media-grid">${[
      {name:'لعبة الحروف',emo:'🔠',sub:'تعليمية وتفاعلية',act:'kidquiz',p1:'#19677f',p2:'#0d2330'},
      {name:'لعبة الذاكرة',emo:'🧠',sub:'احفظ التسلسل',act:'memory',p1:'#6b4289',p2:'#1c1836'},
      {name:'كرة القدم',emo:'⚽',sub:'قريبًا',act:'soon',p1:'#226d57',p2:'#0a2119'},
      {name:'سباق السيارات',emo:'🏎️',sub:'قريبًا',act:'soon',p1:'#8e3c44',p2:'#281621'}
   ].map(p=>`<button class="poster" style="--p1:${p.p1};--p2:${p.p2};--p3:#61cbd0" data-game="${p.act}"><div class="emoji">${p.emo}</div><strong>${p.name}</strong><small>${p.sub}</small></button>`).join('')}</div></main>`}
  function renderSettings(){return `<main class="content">${head('SETTINGS','الإعدادات','خصص واجهتك. التغييرات في الألوان والمفضلة تُحفظ داخل هذا المتصفح على نفس الجهاز.')}<div class="settings-layout"><div class="glass settings-side"><button class="${settingsTab==='appearance'?'selected':''}" data-settings-tab="appearance">🎨 المظهر والتخصيص</button><button class="${settingsTab==='apps'?'selected':''}" data-settings-tab="apps">▦ إدارة المفضلة</button><button class="${settingsTab==='system'?'selected':''}" data-settings-tab="system">⚙ معلومات الجهاز</button></div><div class="glass settings-main">${renderSettingsContent()}</div></div></main>`}
  function renderSettingsContent(){if(settingsTab==='appearance')return `<h2>المظهر والتخصيص</h2><div class="settings-row"><div><strong>اللون الرئيسي</strong><small>اختر لون التحديد والتفاعل</small></div><div class="color-options">${Object.keys(COLORS).map(c=>`<button aria-label="${c}" class="color-dot ${accent===c?'picked':''}" data-color="${c}" style="--swatch:${COLORS[c][0]}"></button>`).join('')}</div></div><div class="settings-row"><div><strong>التنقل السريع</strong><small>انتقل بين الأقسام بأسهم الريموت وزر OK</small></div><span>⌨️</span></div><div class="settings-row"><div><strong>حفظ التفضيلات</strong><small>اللون والمفضلة محفوظان محليًا على جهازك</small></div><span style="color:var(--accent)">✓ مفعّل</span></div>`;
    if(settingsTab==='apps')return `<h2>إدارة المفضلة</h2><p class="muted">اضغط نجمة التطبيق لإضافته أو إزالته من الشاشة الرئيسية (حد أقصى 6).</p>${APPS.map(a=>`<div class="settings-row"><div><strong>${t(a.name)}</strong><small>${a.cat==='video'?'فيديو':a.cat==='kids'?'أطفال':'تطبيق'}</small></div><button class="outline" data-fav="${a.id}">${favorites.includes(a.id)?'★ إزالة':'☆ إضافة'}</button></div>`).join('')}`;
    return `<h2>عن Bandar TV</h2><div class="settings-row"><div><strong>الإصدار</strong><small>1.0 — نسخة أولية تفاعلية</small></div><span>2026</span></div><div class="settings-row"><div><strong>الجهاز</strong><small>${window.BandarAndroid?'نسخة Android TV':'نسخة متصفح للمعاينة'}</small></div><span>📺</span></div><div class="settings-row"><div><strong>الشبكة</strong><small>يمكن التحكم بشبكة Wi-Fi داخل إصدار Android فقط</small></div><button class="outline" data-action="wifi">إعدادات Wi-Fi</button></div>`;
  }
  function footer(){return `<footer class="bottom-tip"><span>← → ↑ ↓ للتنقل &nbsp; • &nbsp; Enter للاختيار &nbsp; • &nbsp; Esc للعودة</span><span>تصميم خاص بك — الإصدار التجريبي 1.0</span></footer>`}
  function renderModal(){if(!modal)return '';return `<div class="modal-shade" data-action="close-overlay"><section class="modal glass" role="dialog" aria-modal="true"><h2>${modal.title}</h2><p>${modal.body}</p><div class="modal-actions">${modal.action||''}<button class="outline" data-action="close">إغلاق</button></div></section></div>`}
  function render(){appElement.innerHTML=navHTML()+({home:renderHome,apps:renderApps,movies:renderMovies,live:renderLive,kids:renderKids,games:renderGames,settings:renderSettings}[view]||renderHome)()+footer()+renderModal();document.title=`${NAV.find(n=>n[0]===view)?.[1]||'الرئيسية'} | Bandar TV`;}
  function changeView(id){if(!NAV.some(n=>n[0]===id))return;view=id;category='all';query='';modal='';render();window.scrollTo({top:0,behavior:'auto'});const first=document.querySelector('.nav-btn.active');first?.focus({preventScroll:true});}
  function fav(id){if(favorites.includes(id)){favorites=favorites.filter(x=>x!==id);showToast('تمت الإزالة من المفضلة');}else if(favorites.length<6){favorites.push(id);showToast('تمت الإضافة إلى المفضلة');}else{showToast('الحد الأقصى 6 تطبيقات. احذف أحد التطبيقات أولاً.');return;}save('favorites',favorites);render();}
  function launch(id){const a=APPS.find(x=>x.id===id);if(!a)return;let nativeWorked=false;try{if(window.BandarAndroid&&typeof window.BandarAndroid.launchPackage==='function')nativeWorked=window.BandarAndroid.launchPackage(a.pkg);}catch(err){console.warn(err)}if(nativeWorked)return;
    modal={title:`${a.name}`,body:'في نسخة المتصفح يمكنك فتح الموقع الرسمي. أما في تطبيق Android TV، فيمكن ربط هذا الزر بالتطبيق المثبّت على التلفزيون (إذا كان متوفراً).',action:`<button class="primary" data-url="${t(a.url)}">فتح الموقع الرسمي ↗</button><button class="outline" data-fav="${a.id}">${favorites.includes(a.id)?'★ إزالة من المفضلة':'☆ إضافة للمفضلة'}</button>`};render();}
  const trialMessage='هذه بطاقة لعرض شكل الواجهة. ربطها بمكتبة فيديو أو خدمة بث حقيقية يحتاج إلى مصدر محتوى مرخّص.';
  function quizAnswer(letter){const correct=['أ','ب','ق','ت'][quizIndex%4];if(letter===correct){kidScore++;quizIndex++;render();showToast('أحسنت! إجابة صحيحة 🌟');}else showToast('حاول مرة أخرى 😊');}
  function actionClick(e){const b=e.target.closest('[data-view],[data-category],[data-launch],[data-action],[data-url],[data-fav],[data-color],[data-settings-tab],[data-media],[data-stream],[data-game],[data-quiz]');if(!b)return;
    if(b.hasAttribute('data-view'))return changeView(b.dataset.view);
    if(b.hasAttribute('data-category')){category=b.dataset.category;return render()}
    if(b.hasAttribute('data-launch'))return launch(b.dataset.launch);
    if(b.hasAttribute('data-fav'))return fav(b.dataset.fav);
    if(b.hasAttribute('data-color')){accent=b.dataset.color;save('accent',accent);applyAccent();return render()}
    if(b.hasAttribute('data-settings-tab')){settingsTab=b.dataset.settingsTab;return render()}
    if(b.hasAttribute('data-quiz'))return quizAnswer(b.dataset.quiz);
    if(b.hasAttribute('data-url')){const u=b.dataset.url;if(/^https:\/\//.test(u)){if(window.BandarAndroid?.openWebsite)window.BandarAndroid.openWebsite(u);else window.open(u,'_blank','noopener,noreferrer')}return}
    if(b.hasAttribute('data-media')){modal={title:MEDIA[+b.dataset.media].title,body:trialMessage};return render()}
    if(b.hasAttribute('data-stream')){modal={title:STREAMS[+b.dataset.stream].name,body:'هذا القسم تصوّر مبدئي وليس خدمة بث. سوف نربط القنوات المتاحة قانونيًا في مرحلة لاحقة.'};return render()}
    if(b.hasAttribute('data-game')){let a=b.dataset.game;if(a==='kidquiz')return changeView('kids');modal={title:a==='memory'?'لعبة الذاكرة':'قريباً',body:'هذه لعبة سيتم تطويرها لاحقًا. لعبة الحروف متاحة الآن ضمن قسم الأطفال.'};return render()}
    if(b.dataset.action==='close'||b.dataset.action==='close-overlay'){if(b.dataset.action==='close-overlay'&&e.target!==b)return;modal='';return render()}
    if(b.dataset.action==='wifi'){if(window.BandarAndroid?.openWifiSettings){window.BandarAndroid.openWifiSettings()}else showToast('إعدادات Wi-Fi متاحة في تطبيق Android TV فقط');return}
    if(b.dataset.action==='search'){modal={title:'البحث في التطبيقات',body:'ابحث في قائمة تطبيقاتك من خلال حقل البحث التالي:<input id="search-field" class="search-box" type="search" placeholder="مثلاً: شاهد أو YouTube" autocomplete="off" />',action:'<button class="primary" data-action="submit-search">بحث</button>'};render();document.querySelector('#search-field')?.focus();return}
    if(b.dataset.action==='submit-search'){query=document.getElementById('search-field')?.value.trim()||'';view='apps';category='all';modal='';render();return}
  }
  appElement.addEventListener('click',actionClick);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'){if(modal){modal='';render()}else if(view!=='home')changeView('home');return}
    if(e.key==='Enter'&&e.target.id==='search-field'){e.preventDefault();query=e.target.value.trim();modal='';view='apps';category='all';render();return}
    if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)||e.target.tagName==='INPUT')return;
    const all=[...document.querySelectorAll('button:not([disabled]),a[href],input')].filter(el=>{const rect=el.getBoundingClientRect();return rect.width>0&&rect.height>0});
    const curr=document.activeElement;if(!all.includes(curr)){all[0]?.focus();e.preventDefault();return}
    const r=curr.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const dir=e.key;let best=null,score=Infinity;
    for(const el of all){if(el===curr)continue;const q=el.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2,dx=x-cx,dy=y-cy;
      if(dir==='ArrowRight'&&dx<=12||dir==='ArrowLeft'&&dx>=-12||dir==='ArrowDown'&&dy<=12||dir==='ArrowUp'&&dy>=-12)continue;
      const major=(dir==='ArrowRight'||dir==='ArrowLeft')?Math.abs(dx):Math.abs(dy),minor=(dir==='ArrowRight'||dir==='ArrowLeft')?Math.abs(dy):Math.abs(dx);
      const s=major+minor*2.2;if(s<score){best=el;score=s}
    }
    if(best){e.preventDefault();best.focus();best.scrollIntoView({block:'nearest',inline:'nearest'})}
  });
  function refreshClock(){const c=document.getElementById('clock');if(c)c.textContent=clockLabel();const d=document.getElementById('dayline');if(d)d.textContent=dateLabel();const p=document.getElementById('prayers');if(p&&prayers)p.innerHTML=renderPrayers();}
  async function fetchLive(){try{const w=await fetch('https://api.open-meteo.com/v1/forecast?latitude=24.7136&longitude=46.6753&current=temperature_2m,weather_code&timezone=Asia%2FRiyadh',{signal:AbortSignal.timeout(7000)});if(w.ok){weather=(await w.json()).current;const temp=document.getElementById('temp');if(temp)temp.textContent=Math.round(weather.temperature_2m)+'°';const wi=document.getElementById('weather-icon');if(wi)wi.textContent=weatherIcon()}}catch(err){console.info('Weather unavailable, showing placeholders')}
    try{const p=await fetch('https://api.aladhan.com/v1/timingsByCity?city=Riyadh&country=Saudi%20Arabia&method=4',{signal:AbortSignal.timeout(7000)});if(p.ok){prayers=(await p.json()).data;const pe=document.getElementById('prayers');if(pe)pe.innerHTML=renderPrayers()}}catch(err){console.info('Prayer API unavailable, showing placeholders')}
    const wtext=document.querySelector('.weather-panel .muted:last-child');if(wtext&&weather)wtext.textContent='حالة الطقس الحالية';if(wtext&&!weather)wtext.textContent='الطقس غير متوفر دون اتصال';
  }
  applyAccent();render();setInterval(refreshClock,15000);fetchLive();
})();
</script></body></html>
